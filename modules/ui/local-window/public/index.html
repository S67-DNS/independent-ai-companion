<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本地窗口</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>本地窗口</h1>
          <p id="brand-sub">独立会话 · 仅本机</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="channel-badge" class="badge" title="当前通信通道">通道</span>
        <button id="export-btn" class="btn btn-ghost" type="button">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3v9m0 0 3.2-3.2M10 12 6.8 8.8M4 14.5V16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          导出 TXT
        </button>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <div class="empty-mark" aria-hidden="true"></div>
        <h2>开始对话</h2>
        <p>这是本地窗口的独立会话，与 QQ、DSH 和任何通信平台无关。</p>
      </div>
    </section>

    <footer class="composer">
      <div id="pending" class="pending" hidden></div>
      <div class="composer-row">
        <label class="icon-btn" for="file-input" title="添加图片 / 音频 / 视频">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12.6 6.1 7.3 11.4a2.4 2.4 0 1 0 3.4 3.4l5.6-5.6a4 4 0 1 0-5.7-5.7L4.9 8.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="file-input" type="file" multiple accept="image/*,audio/*,video/*" hidden />
        </label>
        <textarea id="input" rows="1" placeholder="说点什么…" aria-label="消息输入"></textarea>
        <button id="send-btn" class="btn btn-send" type="button">
          <span>发送</span>
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m4 10 11-5-3.2 10L9.6 11 4 10Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · 附件仅保存在本机</div>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
